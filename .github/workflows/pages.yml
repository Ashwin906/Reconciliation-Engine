name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build Web
        env:
          # Backend origin for the static bundle. Set it once with:
          #   gh variable set VITE_API_BASE --body "https://<backend-host>"
          # Re-running this workflow then rebuilds the dashboard against it.
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: |
          cd web
          npm ci
          npm run build

      - name: Prepare Pages Artifact
        run: |
          mkdir -p _site
          cp -r web/dist/* _site/
          cp landing.html _site/index.html
          cp web/dist/index.html _site/dashboard.html
          cp pitch-script.html _site/pitch-script.html
          cp intro-video.html _site/intro-video.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
